services:
  tinyupdater:
    build: .
    image: ghcr.io/its-the-vibe/tinyupdater:latest
    pull_policy: always    
    ports:
      - "${PORT}:8080"
    volumes:
      - ./config.yaml:/etc/tinyupdater/config.yaml:ro
      - ./repositories:/repositories:ro
    read_only: true
    restart: on-failure:10    
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
